{{- $ghLib := printf "%s/lib/github-release.sh" .chezmoi.workingTree }}

{{- $zshSyntaxHighlightingSha := output "bash" "-c" (printf "source %s; github_commit_before zsh-users/zsh-syntax-highlighting master" $ghLib) | trim }}
[".zsh/plugins/zsh-syntax-highlighting"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/{{ $zshSyntaxHighlightingSha }}.tar.gz"
  exact = true
  stripComponents = 1
  refreshPeriod = "168h"
{{- $zshAutosuggestionsSha := output "bash" "-c" (printf "source %s; github_commit_before zsh-users/zsh-autosuggestions master" $ghLib) | trim }}
[".zsh/plugins/zsh-autosuggestions"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-autosuggestions/archive/{{ $zshAutosuggestionsSha }}.tar.gz"
  exact = true
  stripComponents = 1
  refreshPeriod = "168h"
{{- $youShouldUseSha := output "bash" "-c" (printf "source %s; github_commit_before MichaelAquilina/zsh-you-should-use master" $ghLib) | trim }}
[".zsh/plugins/you-should-use"]
  type = "archive"
  url = "https://github.com/MichaelAquilina/zsh-you-should-use/archive/{{ $youShouldUseSha }}.tar.gz"
  exact = true
  stripComponents = 1
  refreshPeriod = "168h"
{{- $fzfTabSha := output "bash" "-c" (printf "source %s; github_commit_before Aloxaf/fzf-tab master" $ghLib) | trim }}
[".zsh/plugins/fzf-tab"]
  type = "archive"
  url = "https://github.com/Aloxaf/fzf-tab/archive/{{ $fzfTabSha }}.tar.gz"
  exact = true
  stripComponents = 1
  refreshPeriod = "168h"
[".zsh/completion/_fzf"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/lmburns/dotfiles/master/.config/zsh/completions/_fzf"
  refreshPeriod = "168h"
[".zsh/completion/_eza"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/eza-community/eza/main/completions/zsh/_eza"
  refreshPeriod = "168h"
[".local/share/bash-completion/completions/git"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/git/git/master/contrib/completion/git-completion.bash"
  refreshPeriod = "168h"
[".zsh/completion/_git"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/git/git/master/contrib/completion/git-completion.zsh"
  refreshPeriod = "168h"
[".zsh/completion/_rustc"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/plugins/rust/_rustc"
  refreshPeriod = "168h"
[".config/bat/themes/Boron.tmTheme"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/mjio/boron.tmtheme/master/Boron.tmTheme"
  refreshPeriod = "168h"
[".config/bat/syntaxes/nushell.sublime-syntax"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/kurokirasama/nushell_sublime_syntax/refs/heads/main/nushell.sublime-syntax"
  refreshPeriod = "168h"
  # Hack: Fix regex error in nushell syntax file
  # see: https://github.com/kurokirasama/nushell_sublime_syntax/issues/4
  filter.command = "sed"
  filter.args = [ "-e", 's/| *? *|/| \\? |/g' ]
[".config/bat/syntaxes/ledger.sublime-syntax"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/etienne-monier/LedgerTools/refs/heads/master/Ledger.sublime-syntax"
  refreshPeriod = "168h"
[".config/bat/syntaxes/tmux.sublime-syntax"]
  type = "file"
  readonly = true
  url = "https://raw.githubusercontent.com/gerardroche/sublime-tmux/refs/heads/master/Tmux.sublime-syntax"
  refreshPeriod = "168h"
